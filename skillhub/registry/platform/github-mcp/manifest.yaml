apiVersion: skillhub/v0
kind: mcp_server
namespace: platform
name: github-mcp
version: 0.4.0
description: "Read/write access to GitHub via the MCP GitHub server."
author: "platform-team@acme.example"
status: approved
reviewer: "alice@acme.example"
permissions:
  - read_files
  - write_files
  - network:api.github.com
  - read_env:GITHUB_TOKEN
visibility: private
signature: "UNSIGNED-PROTOTYPE"
mcp_server:
  command: "npx"
  args:
    - "-y"
    - "@modelcontextprotocol/server-github"
  env:
    GITHUB_TOKEN: ""
  mcp_json_key: "github"
