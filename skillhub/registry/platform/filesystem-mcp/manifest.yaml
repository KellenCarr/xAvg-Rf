apiVersion: skillhub/v0
kind: mcp_server
namespace: platform
name: filesystem-mcp
version: 1.0.0
description: "Read/write access to a configured local directory via the official MCP filesystem server."
author: "platform-team@acme.example"
status: approved
reviewer: "alice@acme.example"
permissions:
  - read_files
  - write_files
visibility: private
signature: "UNSIGNED-PROTOTYPE"
mcp_server:
  command: "npx"
  args:
    - "-y"
    - "@modelcontextprotocol/server-filesystem"
    - "${WORKSPACE}"
  env:
    WORKSPACE: "./"
  mcp_json_key: "filesystem"
