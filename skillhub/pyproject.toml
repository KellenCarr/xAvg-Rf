[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillhub"
version = "0.1.0"
description = "Enterprise agent skill & tool registry (prototype)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
skillhub = "skillhub.cli.main:app"
skillhub-api = "skillhub.api.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["skillhub*"]
